<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="css/cadastroProduto.css">
</head>
<body>
    
    <!-- Cabeçalho Superior -->
    <header class="top-header">
        <div class="company-name">
            <span>Minha Empresa</span>
        </div>
        
        <div class="user-profile">
            <span class="user-name">Ciclano do Teste</span>
            <a href="#" class="btn-logout">Sair</a>
        </div>
    </header>
    
    <!-- Menu Lateral -->
    <nav class="sidebar">
        <ul class="menu-list">
            <li><a href="#"><img src="icones/inicio.png" alt="">Início</a></li>
            <li><a href="#"><img src="icones/pdv.png" alt="">PDV</a></li>
            <li><a href="#"><img src="icones/caixa.png" alt="">Caixa</a></li>
            <li><a href="#"><img src="icones/estoque.png" alt="">Estoque</a></li>
            <li><a href="#" class="active"><img src="icones/produtos.png" alt="">Produtos</a></li>
            <li><a href="#"><img src="icones/usuarios.png" alt="">Usuários</a></li>
            <li><a href="#"><img src="icones/relatorio.png" alt="">Relatórios</a></li>
            <li><a href="#"><img src="icones/configuracao.png" alt="">Configurações</a></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="content">
        <div class="welcome-section">
            <h1>Cadastro de Produtos</h1>
            <p>Preencha os campos abaixo para adicionar um novo item ao estoque.</p>
        </div>

        <div class="form-container">
            <form action="" method="POST" enctype="multipart/form-data" class="product-form">
                
                <div class="form-group full-width">
                    <label for="nomeProduto">Nome do Produto:</label>
                    <input type="text" id="nomeProduto" name="nomeProduto" placeholder="Ex: Camiseta Algodão Premium" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="unidade">UN (Unidade de Medida):</label>
                    <input type="text" id="unidade" name="unidade" placeholder="Ex: UN, KG, PC" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria:</label>
                    <input type="text" id="categoria" name="categoria" placeholder="Ex: Vestuário" class="inputProduto">
                </div>

                <div class="form-group">
                    <label for="precoCusto">Preço de Custo (R$):</label>
                    <input type="number" id="precoCusto" name="precoCusto" step="0.01" min="0" placeholder="0,00" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="precoVenda">Preço de Venda (R$):</label>
                    <input type="number" id="precoVenda" name="precoVenda" step="0.01" min="0" placeholder="0,00" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="estoqueAtual">Estoque Atual:</label>
                    <input type="number" id="estoqueAtual" name="estoqueAtual" min="0" placeholder="0" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="estoqueMinimo">Estoque Mínimo:</label>
                    <input type="number" id="estoqueMinimo" name="estoqueMinimo" min="0" placeholder="0" class="inputProduto">
                </div>

                <div class="form-group full-width">
                    <label for="foto">Foto do Produto:</label>
                    <input type="file" id="foto" name="imagem" accept="image/*" class="inputProduto file-input">
                </div>

                <div class="form-actions full-width">
                    <button type="submit" id="cadastrarProduto" class="btn-submit">Cadastrar Produto</button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
