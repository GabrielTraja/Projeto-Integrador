<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos - Nexagusto</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/cadastroProduto.css">
</head>
<body class="layout-dashboard">
    
    <!-- Cabeçalho Superior -->
    <header class="top-header">
        <div class="company-name">
            <img class="company-logo" src="icones/logo-nexagusto.png" alt="Nexagusto — Seu negócio sempre no controle">
        </div>
        
        <div class="user-profile">
            <span class="user-name">Carregando...</span>
            <button class="btn-logout">Sair</button>
        </div>
    </header>
    
    <!-- Menu Lateral -->
    <nav class="sidebar">
        <ul class="menu-list">
            <li><a href="telaControle.html"><img src="icones/inicio.png" alt="Início"><span>Início</span></a></li>
            <li><a href="pdv.html"><img src="icones/pdv.png" alt="PDV"><span>PDV</span></a></li>
            <li><a href="#"><img src="icones/caixa.png" alt="Caixa"><span>Caixa</span></a></li>
            <li><a href="controleEstoque.html"><img src="icones/estoque.png" alt="Estoque"><span>Estoque</span></a></li>
            <li><a href="cadastroProdutos.html" class="active"><img src="icones/produtos.png" alt="Produtos"><span>Produtos</span></a></li>
            <li><a href="controleUsuarios.html"><img src="icones/usuarios.png" alt="Usuários"><span>Usuários</span></a></li>
            <li><a href="#"><img src="icones/relatorio.png" alt="Relatórios"><span>Relatórios</span></a></li>
            <li><a href="#"><img src="icones/configuracao.png" alt="Configurações"><span>Configurações</span></a></li>
        </ul>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="content">
        <div class="welcome-section">
            <h1>Cadastro de Produtos</h1>
            <p>Preencha os campos abaixo para adicionar ou atualizar um item no estoque.</p>
        </div>

        <div class="form-container">
            <form class="product-form" onsubmit="salvarDados(event)">
                
                <div class="form-group full-width">
                    <label for="nomeProduto">Nome do Produto *:</label>
                    <input type="text" id="nomeProduto" name="nomeProduto" placeholder="Ex: Camiseta Algodão Premium" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="codigoBarras">Código de Barras:</label>
                    <input type="text" id="codigoBarras" name="codigoBarras" placeholder="Ex: 7891234567890" class="inputProduto">
                </div>

                <div class="form-group">
                    <label for="unidade">UN (Unidade de Medida) *:</label>
                    <select id="unidade" name="unidade" class="selectProduto" required>
                        <option value="UN" selected>UN (Unidade)</option>
                        <option value="KG">KG (Quilograma)</option>
                        <option value="PC">PC (Peça)</option>
                        <option value="PAR">PAR (Par)</option>
                        <option value="L">L (Litro)</option>
                        <option value="CX">CX (Caixa)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="categoria">Categoria *:</label>
                    <select id="categoria" name="categoria" class="selectProduto" required>
                        <option value="1">Geral</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="precoCusto">Preço de Custo (R$):</label>
                    <input type="number" id="precoCusto" name="precoCusto" step="0.01" min="0" placeholder="0,00" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="precoVenda">Preço de Venda (R$) *:</label>
                    <input type="number" id="precoVenda" name="precoVenda" step="0.01" min="0" placeholder="0,00" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="estoqueAtual">Estoque Atual *:</label>
                    <input type="number" id="estoqueAtual" name="estoqueAtual" min="0" placeholder="0" class="inputProduto" required>
                </div>

                <div class="form-group">
                    <label for="estoqueMinimo">Estoque Mínimo:</label>
                    <input type="number" id="estoqueMinimo" name="estoqueMinimo" min="0" placeholder="0" class="inputProduto">
                </div>

                <div class="form-group full-width">
                    <label for="descricao">Descrição do Produto:</label>
                    <textarea id="descricao" name="descricao" placeholder="Detalhes, especificações e observações do produto..." class="textareaProduto"></textarea>
                </div>

                <div class="form-actions full-width">
                    <button type="submit" id="cadastrarProduto" class="btn-submit">Salvar Produto</button>
                    <a href="controleEstoque.html" class="btn-cancel">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/produtos.js"></script>
</body>
</html>
