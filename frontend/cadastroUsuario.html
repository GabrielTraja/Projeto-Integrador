<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="caixaLogin">
        <p>Cadastro</p>
        <form action="" method="post">
            <label for="nome">Nome:</label>
            <input type="text" placeholder="Nome Completo" class="inputLogin">

            <label for="cpf">CPF:</label>
            <input type="text" placeholder="CPF" class="inputLogin">

            <label for="usuario">Usuario:</label>
            <input type="text" placeholder="Usuário" class="inputLogin">

            <label for="email">Email:</label>
            <input type="email" placeholder="E-mail" class="inputLogin">

            <label for="telefone">Telefone:</label>
            <input type="number" placeholder="Telefone" class="inputLogin">

            <label for="senha">Senha:</label>
            <input type="password" placeholder="Senha" class="inputLogin">

            <label for="confirmarSenha">Confirme a Senha:</label>
            <input type="password" placeholder="Confirme a sua Senha" class="inputLogin">

            <button id="botaoLogin">Cadastrar</button>
        </form>
    </div>
</body>
</html>
