<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário - PDV Sistema</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="caixaLogin" style="max-width: 480px;">
        <h2>Novo Usuário</h2>
        <p class="subtitulo-form">Preencha os dados abaixo para cadastrar no sistema</p>

        <form id="formCadastroUsuario">
            <label for="nome">Nome Completo *:</label>
            <input type="text" id="nome" name="nome" placeholder="Ex: Gabriel Silva" class="inputLogin" required>

            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" class="inputLogin">

            <label for="usuario">Usuário (Login) *:</label>
            <input type="text" id="usuario" name="login" placeholder="Ex: gabriel.silva" class="inputLogin" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="email@empresa.com" class="inputLogin">

            <label for="telefone">Telefone:</label>
            <input type="text" id="telefone" name="telefone" placeholder="(11) 99999-9999" class="inputLogin">

            <label for="id_tipo_usuario">Perfil de Acesso *:</label>
            <select id="id_tipo_usuario" name="id_tipo_usuario" class="inputLogin" required>
                <option value="3" selected>Operador de Caixa</option>
                <option value="1">Administrador</option>
                <option value="2">Gerente</option>
                <option value="4">Estoquista</option>
            </select>

            <label for="senha">Senha *:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite uma senha forte" class="inputLogin" required>

            <label for="confirmarSenha">Confirme a Senha *:</label>
            <input type="password" id="confirmarSenha" name="confirmarSenha" placeholder="Repita a senha digitada" class="inputLogin" required>

            <button type="submit" id="botaoLogin">Cadastrar Usuário</button>

            <div class="links-login" style="justify-content: center; gap: 15px;">
                <a href="login.html">Voltar para o Login</a>
                <span>•</span>
                <a href="controleUsuarios.html">Gerenciar Usuários</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/usuarios.js"></script>
</body>
</html>
