<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>Adicione seu item: </p>
    <input type="text" name="" id="entrada">
    <button onclick="salvarDados()">Salvar</button>
    <br>

    <p>Itens: </p>

    <div id="editar"></div>

    <div>
        <ul id="resultados"></ul>
    </div>

    <script>
        let listaItens = [];
        let index = 0;

        function salvarDados() {
            let entrada = document.getElementById("entrada").value;
            let entradaObj = {
                id: index,
                texto: entrada
            };
            index++;
            listaItens.push(entradaObj)            
            mostrar();
        };

        function mostrar() {
            let ul = document.getElementById("resultados");
            let html = "";
            listaItens.forEach( item => {
                html += 
                    `<li>
                        ${item.texto} 
                        <button onclick="editar(${item.id})">
                            Editar
                        </button>
                        <button onclick="deletar(${item.id})">
                            Deletar
                        </button>
                    </li>`;
            });

            ul.innerHTML = html;
        };

        function editar(id) {
            let html = 
            `
                <input type="text" name="" id="textoParaEditar">
                <button onclick="editarDados(${id})">
                    Editar
                </button>
            `;

            let diveditar = document.getElementById("editar");
            diveditar.innerHTML = html;
        };

        function editarDados(id) {
            let textoParaEditar = document.getElementById("textoParaEditar").value;
            let resultado = listaItens.find(obj => obj.id === id);
            resultado.texto = textoParaEditar;
            mostrar();
            let diveditar = document.getElementById("editar");
            diveditar.innerHTML = "";
        };

        function deletar(id) {
            let novalista = listaItens.filter(obj => obj.id !== id);
            listaItens = novalista;
            mostrar();
        };
    </script>
</body>
</html>
