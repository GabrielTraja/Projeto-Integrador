<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Nexagusto</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div id="caixaLogin">
        <img class="brand-logo" src="icones/logo-nexagusto.png" alt="Nexagusto — Seu negócio sempre no controle">
        <h2>Acesse sua conta</h2>
        <p class="subtitulo-form">Informe suas credenciais para acessar o painel</p>

        <div id="mensagemFeedback" class="mensagem-feedback"></div>

        <form id="formLogin">
            <label for="loginUsuario">Usuário ou E-mail:</label>
            <input type="text" id="loginUsuario" placeholder="Ex: barista@cafeteria.com ou admin" class="inputLogin" required autofocus>
            
            <label for="senhaUsuario">Senha:</label>
            <input type="password" id="senhaUsuario" placeholder="Sua senha de acesso" class="inputLogin" required>

            <button type="submit" id="botaoLogin">Entrar no Sistema</button>

            <div class="links-login">
                <a href="cadastroUsuario.html" class="btn-link-cadastro">Não possui uma conta? Cadastre novo usuário</a>
            </div>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const formLogin = document.getElementById('formLogin');
        const feedback = document.getElementById('mensagemFeedback');

        formLogin.onsubmit = async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('loginUsuario').value.trim();
            const senha = document.getElementById('senhaUsuario').value;

            feedback.style.display = 'none';

            try {
                const resposta = await api.post('/api/auth/login', { usuario, senha });
                if (resposta.sucesso) {
                    feedback.className = 'mensagem-feedback mensagem-sucesso';
                    feedback.textContent = 'Login efetuado com sucesso! Redirecionando...';
                    feedback.style.display = 'block';

                    auth.salvarUsuario(resposta.usuario, resposta.token);
                    setTimeout(() => {
                        window.location.href = 'telaControle.html';
                    }, 500);
                }
            } catch (erro) {
                feedback.className = 'mensagem-feedback mensagem-erro';
                feedback.textContent = erro.message || 'Erro ao realizar login.';
                feedback.style.display = 'block';
            }
        };
    </script>
</body>
</html>
