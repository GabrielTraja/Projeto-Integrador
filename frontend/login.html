<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="caixaLogin">
        <p>Login</p>
        <form action="" method="post">
            <label for="usuario">Usuario:</label>
            <input type="text" placeholder="Digite o seu usuário" class="inputLogin">
            
            <label for="senha">Senha:</label>
            <input type="password" placeholder="Digite a sua senha" class="inputLogin">

            <button type="submit" id="botaoLogin">Login</button>
            <a href="cadastroUsuario.html">Não tem Login?</a>
        </form>
    </div>
</body>
</html>
